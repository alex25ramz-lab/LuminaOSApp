name: Compilar APK Lumina OS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: kivy/buildozer-action@v1.22
        with:
          command: buildozer android debug
          subfolder: .

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: LuminaOS-APK
          path: bin/*.apk
